<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Serenity Stocks</title>
  <link rel="manifest" href="manifest.json">

  <!-- Add the stylesheet to the head -->
  <link rel="stylesheet" type="text/css" href="clippy.css">
</head>
<body bgcolor="black">
  <script src="flutter_bootstrap.js" async></script>

  <script src="clippy.js"></script>

  <script>
    window.clippyInit = function(){ clippy.init(); }
    window.clippySpeak = function(message){ clippy.displayMessage(message); }

    window.darkOpacity = 1;

    window.toggleDarkMode = function(){
        window.darkOpacity = window.darkOpacity * 0.9;
        document.getElementsByTagName('flutter-view')[0].style.opacity = window.darkOpacity;
    }
  </script>
</body>
</html>
